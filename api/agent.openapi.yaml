      x-required-role: viewer
      responses:
        '200':
          description: Profiles
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Profile'}
                    maxItems: 200
        '400':
