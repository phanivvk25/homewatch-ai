openapi: 3.1.0
info:
  title: Home Network Tracker Agent Local API
  version: 1.0.0
  summary: LAN API served by the Home Agent to paired apps.
  description: |
    Served by the Home Agent on the LAN at `https://<agent-ip>:8443` (TLS 1.3 only).

    **Transports.** The same API is reachable in two ways:
    1. **LAN:** mutual TLS. The client cert is issued by the household CA at pairing, and the agent cert is SPKI-pinned by the app.
    2. **Remote:** HTTP/1.1 messages carried inside a Noise_IK tunnel over the cloud relay (see `cloud.openapi.yaml`, `/v1/relay/tunnel`). The relay never sees plaintext.

    **Authorisation.** Every operation except `POST /v1/pair` requires a valid, non-revoked client certificate.
    The minimum role is given by `x-required-role` (`viewer` < `member` < `owner`). The agent reads the role from its member table, never from certificate fields.

    **Conventions.**
    - Timestamps are RFC 3339 UTC.
    - List endpoints use opaque keyset cursors (`cursor`, `next_cursor`) with `limit` ≤ 200.
    - Errors use RFC 9457 `application/problem+json`.
    - Mutating requests accept an `Idempotency-Key` header (UUID). Replays within 24 h return the original response.
    - MAC addresses are masked unless `reveal=true` is requested by an `owner`. Every reveal is audited.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  contact:
    name: Home Network Tracker Security
    url: https://github.com/phanivvk25/homewatch-ai/security/policy
servers:
  - url: https://{agentHost}:8443
    description: Local Home Agent on the household LAN (production; also reachable tunnelled through the relay)
    variables:
      agentHost:
        default: hnt-agent.local
        description: Agent IP or mDNS name. The certificate is verified by SPKI pin, not hostname.
    x-internal: false
security:
  - mtls: []
tags:
  - name: pairing
    description: Pairing, invites, paired clients and certificates
  - name: agent
    description: Agent status, settings, updates and remote mode
  - name: devices
    description: Device inventory, merge and identifiers
  - name: sessions
    description: Connection history
  - name: sites
    description: Domains visited
  - name: alerts
    description: Alerts and alert rules
  - name: profiles
    description: Family member profiles
  - name: privacy
    description: Consent, export, erasure and audit
  - name: sync
    description: Offline-first delta sync

paths:
  /v1/pair:
    post:
      tags: [pairing]
      operationId: pair
      summary: Complete pairing using a one-time token from the QR code
      description: |
        This operation needs no client certificate. The caller has pinned the agent SPKI from the QR code.
        `proof` = base64url(HMAC-SHA256(token_secret, csr_der ‖ noise_pub ‖ tls_exporter)),
        where `tls_exporter` = TLS exporter value for label `EXPORTER-hnt-pairing`, 32 bytes.
        Limits: 5 attempts per token and 20 per hour per source IP. Tokens are single-use and expire within 5 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PairRequest'}
      responses:
        '200':
          description: Paired. Store the certificate and keys in secure storage.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PairResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401':
          description: Token unknown, expired, used, or proof invalid
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/me:
    get:
      tags: [pairing]
      operationId: getMe
      summary: Identity and role of the calling client
      x-required-role: viewer
      responses:
        '200':
          description: Caller identity
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/invites:
    post:
      tags: [pairing]
      operationId: createInvite
      summary: Create a one-time pairing token for a new member or viewer
      description: The returned payload is rendered as a QR code by the owner's app. It expires in 5 minutes.
      x-required-role: owner
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InviteRequest'}
      responses:
        '201':
          description: Invite created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PairingQrPayload'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/members:
    get:
      tags: [pairing]
      operationId: listMembers
      summary: List household members and their paired clients
      x-required-role: member
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Member'}
                    maxItems: 200
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/MemberId'
    patch:
      tags: [pairing]
      operationId: updateMember
      summary: Rename a member or change their role (not to or from owner)
      x-required-role: owner
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/MemberUpdate'}
      responses:
        '200':
          description: Updated member
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [pairing]
      operationId: removeMember
      summary: Remove a member and revoke all their clients
      x-required-role: owner
      responses:
        '204': {description: "Removed"}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/clients/{clientId}:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    delete:
      tags: [pairing]
      operationId: revokeClient
      summary: Revoke a paired app install (takes effect on next handshake, at most 1 s)
      description: Owners can revoke any client. Members and viewers can revoke only their own.
      x-required-role: viewer
      responses:
        '204': {description: "Revoked"}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/certificates/renew:
    post:
      tags: [pairing]
      operationId: renewCertificate
      summary: Renew the caller's client certificate (allowed after 80% of its lifetime)
      x-required-role: viewer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csr]
              properties:
                csr:
                  type: string
                  contentEncoding: base64
                  description: DER-encoded PKCS#10 CSR (P-256)
                  maxLength: 8192
      responses:
        '200':
          description: New certificate. The old one remains valid until it expires.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CertificateBundle'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/agent:
    get:
      tags: [agent]
      operationId: getAgentInfo
      summary: Agent status, version, capture mode and health
      x-required-role: viewer
      responses:
        '200':
          description: Agent information
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentInfo'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/settings:
    get:
      tags: [agent]
      operationId: getSettings
      summary: Household settings
      x-required-role: viewer
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Settings'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [agent]
      operationId: updateSettings
      summary: Update settings (JSON Merge Patch)
      description: Shortening `retention_days` deletes older data within one hour.
      x-required-role: owner
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/SettingsUpdate'}
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Settings'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/upstreams:
    get:
      tags: [agent]
      operationId: listUpstreamPresets
      summary: Built-in upstream DNS resolver presets
      x-required-role: viewer
      responses:
        '200':
          description: Presets
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/UpstreamPreset'}
                    maxItems: 200
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/remote:
    get:
      tags: [agent]
      operationId: getRemoteStatus
      summary: Remote-mode status
      x-required-role: viewer
      responses:
        '200':
          description: Remote status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RemoteStatus'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/remote/enable:
    post:
      tags: [agent]
      operationId: enableRemote
      summary: Enroll the agent with the cloud relay (LAN only)
      description: Rejected with 403 when the request arrives through the relay tunnel. Enabling remote access must happen on the LAN.
      x-required-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RemoteEnableRequest'}
      responses:
        '200':
          description: Enrolled and connected
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RemoteStatus'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          description: Relay rejected the enrollment or is unreachable
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}

  /v1/remote/disable:
    post:
      tags: [agent]
      operationId: disableRemote
      summary: Disconnect from the relay and delete the relay credential
      x-required-role: owner
      responses:
        '200':
          description: Remote disabled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RemoteStatus'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/updates:
    get:
      tags: [agent]
      operationId: getUpdateStatus
      summary: Agent update status (last verified signed manifest)
      x-required-role: viewer
      responses:
        '200':
          description: Update status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UpdateStatus'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/updates/apply:
    post:
      tags: [agent]
      operationId: applyUpdate
      summary: Apply the available verified update now (binary/OpenWrt installs only)
      x-required-role: owner
      responses:
        '202':
          description: Update started. The agent restarts and rolls back automatically on a failed health check.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: No update available, or the install type does not support self-update (Docker)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/dashboard:
    get:
      tags: [sites]
      operationId: getDashboard
      summary: Devices online now, top sites today, new devices this week
      x-required-role: viewer
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Dashboard'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: List devices
      x-required-role: viewer
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [online, offline, all], default: all}
        - name: profile_id
          in: query
          schema: {type: string, format: uuid, maxLength: 36}
        - name: trusted
          in: query
          schema: {type: boolean}
        - name: q
          in: query
          description: Case-insensitive match on name, vendor, hostname or IP
          schema: {type: string, maxLength: 64}
        - name: sort
          in: query
          schema: {type: string, enum: [last_seen, first_seen, name], default: last_seen}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Devices
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DevicePage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/devices/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [devices]
      operationId: getDevice
      summary: Get a device
      x-required-role: viewer
      parameters:
        - $ref: '#/components/parameters/Reveal'
      responses:
        '200':
          description: Device
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Device'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [devices]
      operationId: updateDevice
      summary: Rename, set type, assign profile, mark trusted (JSON Merge Patch)
      x-required-role: member
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/DeviceUpdate'}
      responses:
        '200':
          description: Updated device
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Device'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [devices]
      operationId: deleteDevice
      summary: Forget a device and all its sessions and queries
      x-required-role: owner
      responses:
        '204': {description: "Deleted"}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/devices/{deviceId}/identifiers:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [devices]
      operationId: listDeviceIdentifiers
      summary: MACs, hostnames and fingerprints associated with the device
      x-required-role: member
      parameters:
        - $ref: '#/components/parameters/Reveal'
      responses:
        '200':
          description: Identifiers
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/DeviceIdentifier'}
                    maxItems: 200
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/devices/{deviceId}/merge:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [devices]
      operationId: mergeDevices
      summary: Merge other devices into this one (undoable for 7 days)
      x-required-role: member
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MergeRequest'}
      responses:
        '200':
          description: Merged
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MergeResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/merges/{mergeId}/undo:
    parameters:
      - name: mergeId
        in: path
        required: true
        schema: {type: string, format: uuid, maxLength: 36}
    post:
      tags: [devices]
      operationId: undoMerge
      summary: Undo a merge within its 7-day window
      x-required-role: member
      responses:
        '200':
          description: Undone. Returns the restored devices.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Device'}
                    maxItems: 200
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410':
          description: Undo window expired
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/devices/{deviceId}/sessions:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [sessions]
      operationId: listDeviceSessions
      summary: Connection timeline for a device (newest first)
      x-required-role: viewer
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/sites:
    get:
      tags: [sites]
      operationId: listSites
      summary: Domains visited, grouped by registrable domain (eTLD+1)
      description: |
        Household-wide by default. Pass `device_id` or `profile_id` to narrow the results.
        Sorted by `query_count` desc unless `sort=last_seen`. The `infrastructure` category is excluded unless `include_hidden=true`.
      x-required-role: viewer
      parameters:
        - name: device_id
          in: query
          schema: {type: string, format: uuid, maxLength: 36}
        - name: profile_id
          in: query
          schema: {type: string, format: uuid, maxLength: 36}
        - name: category
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: {$ref: '#/components/schemas/CategoryCode'}
            maxItems: 100
        - name: q
          in: query
          description: Substring match on the registrable domain or brand
          schema: {type: string, maxLength: 64}
        - name: include_hidden
          in: query
          schema: {type: boolean, default: false}
        - name: sort
          in: query
          schema: {type: string, enum: [count, last_seen], default: count}
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Site summaries
          content:
            application/json:
