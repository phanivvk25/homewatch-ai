      x-required-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AlertRuleWrite'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlertRule'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/alert-rules/{ruleId}:
    parameters:
      - name: ruleId
        in: path
        required: true
        schema: {type: string, format: uuid, maxLength: 36}
    put:
      tags: [alerts]
      operationId: replaceAlertRule
      summary: Replace an alert rule
      x-required-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AlertRuleWrite'}
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlertRule'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [alerts]
      operationId: deleteAlertRule
      summary: Delete an alert rule
      x-required-role: owner
      responses:
        '204': {description: "Deleted"}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/consents:
    get:
      tags: [privacy]
      operationId: listConsents
      summary: Consent records stored on the agent
      x-required-role: owner
      responses:
        '200':
          description: Consent records
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ConsentRecord'}
                    maxItems: 200
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [privacy]
      operationId: recordConsent
      summary: Record a consent decision or acknowledgement
      description: Members can record consents for themselves. `minor_parental_consent` and `monitoring_disclosure_ack` require the owner role.
      x-required-role: member
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConsentCreate'}
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsentRecord'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/consents/{consentId}/withdraw:
    parameters:
      - name: consentId
        in: path
        required: true
        schema: {type: string, format: uuid, maxLength: 36}
    post:
      tags: [privacy]
      operationId: withdrawConsent
      summary: Withdraw a consent
      description: |
        Withdrawing `network_monitoring` stops DNS logging and session tracking immediately. The resolver keeps
        working so household internet is not disrupted. Withdrawing `minor_parental_consent` erases that profile's data.
      x-required-role: member
      responses:
        '200':
          description: Withdrawn
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsentRecord'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/export:
    get:
      tags: [privacy]
      operationId: exportData
      summary: Export household data (streamed)
      description: |
        `json` returns a single JSON document. `csv` returns a ZIP archive containing one CSV per entity
        (devices.csv, sessions.csv, queries.csv, sites.csv, alerts.csv, consents.csv). MACs are included unmasked. This operation is audited.
      x-required-role: owner
      parameters:
        - name: format
          in: query
          required: true
          schema: {type: string, enum: [json, csv]}
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Export stream
          headers:
            Content-Disposition:
              schema: {type: string, maxLength: 255}
              description: attachment; filename="hnt-export-<date>.(json|zip)"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExportDocument'}
            application/zip:
              schema:
                type: string
                contentMediaType: application/zip
                maxLength: 255
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/data/erase:
    post:
      tags: [privacy]
      operationId: eraseData
      summary: Delete household data
      description: |
        - `activity`: deletes all DNS queries, aggregates, sessions and alerts. Devices, profiles and pairing are kept.
        - `everything`: factory reset. Deletes the database file and keys (crypto-shredding), revokes all clients,
          disables remote mode and returns the agent to unpaired state. The response is sent before the reset begins.
      x-required-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, confirm]
              properties:
                scope: {type: string, enum: [activity, everything]}
                confirm:
                  type: string
                  const: DELETE
                  description: Must be the literal string DELETE
      responses:
        '202': {description: "Erasure started (completes within 60 s)"}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/audit:
    get:
      tags: [privacy]
      operationId: listAuditLog
      summary: Agent audit log (newest first)
      x-required-role: owner
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Audit entries
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditPage'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/audit/verify:
    get:
      tags: [privacy]
      operationId: verifyAuditLog
      summary: Verify the audit log hash chain
      x-required-role: owner
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                required: [valid, entries_checked]
                properties:
                  valid: {type: boolean}
                  entries_checked: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775807}
                  first_invalid_id: {type: [integer, 'null'], format: int64, minimum: 0, maximum: 9223372036854775807}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/sync/changes:
    get:
      tags: [sync]
      operationId: getChanges
      summary: Delta changes since a revision (offline-first sync)
      description: |
        Returns entities changed after `since`, ordered by revision. Call repeatedly while `has_more` is true.
        If `since` is older than the tombstone horizon (30 days), the agent responds with 410 and the client must do a full resync (`since=0`).
      x-required-role: viewer
      parameters:
        - name: since
          in: query
          required: true
          schema: {type: integer, minimum: 0, format: int64, maximum: 9223372036854775807}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 500, format: int32}
      responses:
        '200':
          description: Changes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncChanges'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '410':
          description: Revision too old. Full resync required.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    mtls:
      type: mutualTLS
      description: Client certificate issued by the household CA at pairing. TLS 1.3 only. Agent SPKI pinned by the client.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: {type: string, format: uuid, maxLength: 36}
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous `next_cursor`
      schema: {type: string, maxLength: 256}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50, format: int32}
    From:
      name: from
      in: query
      description: Inclusive lower bound (defaults to 24 h ago for logs, or the retention start for timelines)
      schema: {type: string, format: date-time, maxLength: 35}
    To:
      name: to
      in: query
      description: Exclusive upper bound (defaults to now)
      schema: {type: string, format: date-time, maxLength: 35}
    Reveal:
      name: reveal
      in: query
      description: Return unmasked MAC addresses (owner only, audited)
      schema: {type: boolean, default: false}
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: {type: string, format: uuid, maxLength: 36}
    ProfileId:
      name: profileId
      in: path
      required: true
      schema: {type: string, format: uuid, maxLength: 36}
    MemberId:
      name: memberId
      in: path
      required: true
      schema: {type: string, format: uuid, maxLength: 36}
    ClientId:
      name: clientId
      in: path
      required: true
      schema: {type: string, format: uuid, maxLength: 36}
    AlertRef:
      name: alertRef
      in: path
      required: true
      schema: {$ref: '#/components/schemas/AlertRef'}
    Etld1:
      name: etld1
      in: path
      required: true
      schema: {type: string, maxLength: 253, pattern: '^[A-Za-z0-9.-]+$'}

  responses:
    BadRequest:
      description: Validation failed
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized:
      description: Missing, invalid or revoked client certificate
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: Role is insufficient for this operation
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: Request conflicts with current state
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    TooManyRequests:
      description: Rate limited
      headers:
        Retry-After:
          schema: {type: integer, format: int32, minimum: 0, maximum: 2147483647}
          description: Seconds to wait
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    InternalError:
      description: Unexpected server error (no internal details are returned)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      required: [type, title, status]
      properties:
        type: {type: string, format: uri-reference, examples: ['https://hnt.dev/problems/validation'], maxLength: 2048}
        title: {type: string, maxLength: 255}
        status: {type: integer, minimum: 400, maximum: 599, format: int32}
        detail: {type: string, maxLength: 2000}
        instance: {type: string, maxLength: 255}
        code:
          type: string
          description: Stable machine-readable error code used for localised messages in the app
          maxLength: 255
        errors:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field: {type: string, maxLength: 255}
              code: {type: string, maxLength: 255}
          maxItems: 100

    Role:
      type: string
      enum: [owner, member, viewer]

    AlertRef:
      type: string
      description: Opaque 128-bit reference, base32 (26 chars, lower-case, no padding)
      pattern: '^[a-z2-7]{26}$'

      maxLength: 255
    PairRequest:
      type: object
      required: [token_id, csr, noise_pub, proof, device_label, platform]
      properties:
        token_id: {type: string, maxLength: 64}
        csr:
          type: string
          contentEncoding: base64
          description: DER-encoded PKCS#10 CSR, ECDSA P-256
          maxLength: 8192
        noise_pub:
          type: string
          contentEncoding: base64
          description: App X25519 static public key (32 bytes)
          maxLength: 64
        proof:
          type: string
          description: base64url HMAC-SHA256 (see operation description)
          maxLength: 64
        device_label: {type: string, minLength: 1, maxLength: 64}
        platform: {type: string, enum: [android, ios]}
        member_name:
          type: string
          minLength: 1
          maxLength: 64
          description: Display name for the new member (ignored when joining as an existing member)

    PairResponse:
      type: object
      required: [household_id, agent_id, member_id, client_id, role, certificate, agent_noise_pub]
      properties:
        household_id: {type: string, format: uuid, maxLength: 36}
        agent_id: {type: string, format: uuid, maxLength: 36}
        member_id: {type: string, format: uuid, maxLength: 36}
        client_id: {type: string, format: uuid, maxLength: 36}
        role: {$ref: '#/components/schemas/Role'}
        certificate: {$ref: '#/components/schemas/CertificateBundle'}
        agent_noise_pub: {type: string, contentEncoding: base64, maxLength: 64}
        monitoring_ack_required:
          type: boolean
          description: True when the owner has not yet acknowledged the monitoring-disclosure duty

    CertificateBundle:
      type: object
      required: [client_cert, ca_cert, not_after]
      properties:
        client_cert: {type: string, description: "PEM", maxLength: 16384}
        ca_cert: {type: string, description: "PEM household CA", maxLength: 16384}
        not_after: {type: string, format: date-time, maxLength: 35}

    PairingQrPayload:
      type: object
      description: |
        Content of the pairing QR. It is encoded on the wire as CBOR then base45, with the prefix `HNT1:`.
        The JSON form is returned to the owner's app, which renders it.
      required: [v, agent_id, lan_addrs, port, spki_sha256, noise_pub, token_id, token_secret, exp, role]
      properties:
        v: {type: integer, const: 1, format: int32, minimum: 0, maximum: 2147483647}
        agent_id: {type: string, format: uuid, maxLength: 36}
        lan_addrs:
          type: array
          minItems: 1
          maxItems: 4
          items: {type: string, description: "IPv4 or IPv6 literal", maxLength: 255}
        port: {type: integer, minimum: 1, maximum: 65535, format: int32}
        spki_sha256: {type: string, contentEncoding: base64, maxLength: 64}
        noise_pub: {type: string, contentEncoding: base64, maxLength: 64}
        token_id: {type: string, maxLength: 255}
        token_secret: {type: string, contentEncoding: base64, description: "128-bit secret", maxLength: 64}
        exp: {type: string, format: date-time, maxLength: 35}
        role: {$ref: '#/components/schemas/Role'}
        qr_text: {type: string, description: "Ready-to-render `HNT1:` string", maxLength: 1024}

    InviteRequest:
      type: object
      required: [role]
      properties:
        role: {type: string, enum: [member, viewer]}

    Me:
      type: object
      required: [member_id, client_id, role, display_name, household_id, transport]
      properties:
        member_id: {type: string, format: uuid, maxLength: 36}
        client_id: {type: string, format: uuid, maxLength: 36}
        household_id: {type: string, format: uuid, maxLength: 36}
        role: {$ref: '#/components/schemas/Role'}
        display_name: {type: string, maxLength: 255}
        cert_not_after: {type: string, format: date-time, maxLength: 35}
        cert_renewal_due: {type: boolean}
        transport: {type: string, enum: [lan, relay]}

    Member:
      type: object
      required: [id, display_name, role, created_at, clients]
      properties:
        id: {type: string, format: uuid, maxLength: 36}
        display_name: {type: string, maxLength: 255}
        role: {$ref: '#/components/schemas/Role'}
        created_at: {type: string, format: date-time, maxLength: 35}
        cloud_linked: {type: boolean}
        clients:
          type: array
          items: {$ref: '#/components/schemas/PairedClient'}
          maxItems: 100

    MemberUpdate:
      type: object
      minProperties: 1
      properties:
        display_name: {type: string, minLength: 1, maxLength: 64}
        role: {type: string, enum: [member, viewer]}

    PairedClient:
      type: object
      required: [id, platform, device_label, paired_at, cert_not_after]
      properties:
        id: {type: string, format: uuid, maxLength: 36}
        platform: {type: string, enum: [android, ios]}
        device_label: {type: string, maxLength: 255}
        paired_at: {type: string, format: date-time, maxLength: 35}
        last_seen_at: {type: [string, 'null'], format: date-time, maxLength: 35}
        cert_not_after: {type: string, format: date-time, maxLength: 35}
        is_current: {type: boolean, description: "True for the calling client"}

    AgentInfo:
      type: object
      required: [agent_id, household_id, version, install_type, arch, capture_mode, started_at, health]
      properties:
        agent_id: {type: string, format: uuid, maxLength: 36}
        household_id: {type: string, format: uuid, maxLength: 36}
        version: {type: string, examples: ['1.0.0'], maxLength: 255}
        install_type: {type: string, enum: [docker, openwrt, binary]}
        arch: {type: string, examples: [arm64], maxLength: 255}
        capture_mode: {$ref: '#/components/schemas/CaptureMode'}
        started_at: {type: string, format: date-time, maxLength: 35}
        lan_addrs:
          type: array
          items: {type: string, maxLength: 255}
          maxItems: 100
        health: {$ref: '#/components/schemas/AgentHealth'}

    AgentHealth:
      type: object
      required: [status, dns, upstream, time_sync, storage]
      properties:
        status: {type: string, enum: [ok, degraded, failing]}
        dns:
          type: object
          required: [serving, qps_1m, p95_overhead_ms]
          properties:
            serving: {type: boolean}
            qps_1m: {type: number}
            p95_overhead_ms: {type: number}
            dropped_log_events_24h: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775807}
        upstream:
          type: object
          required: [reachable]
          properties:
            reachable: {type: boolean}
            p95_rtt_ms: {type: [number, 'null']}
        time_sync:
          type: object
          required: [synced]
          properties:
            synced: {type: boolean}
            offset_ms: {type: [number, 'null']}
        storage:
          type: object
          required: [db_mb, max_db_mb]
          properties:
            db_mb: {type: number}
            max_db_mb: {type: integer, format: int32, minimum: 0, maximum: 2147483647}
            oldest_query_at: {type: [string, 'null'], format: date-time, maxLength: 35}
        devices_without_dns:
          type: integer
          description: Online devices that have sent no queries to the agent in 30 min (possible bypass or misconfiguration)

          format: int32
          minimum: 0
          maximum: 2147483647
    CaptureMode:
      type: string
      enum: [router_dns, agent_dhcp, openwrt]

    UpstreamPreset:
      type: object
      required: [id, name, protocols, doh_url, dot_host]
      properties:
        id: {type: string, enum: [cloudflare, google, quad9, adguard]}
        name: {type: string, maxLength: 255}
        protocols:
          type: array
          items: {type: string, enum: [doh, dot]}
          maxItems: 100
        doh_url: {type: string, format: uri, maxLength: 2048}
        dot_host: {type: string, maxLength: 255}
        privacy_policy_url: {type: string, format: uri, maxLength: 2048}
        filters_malware: {type: boolean}
        india_pop: {type: boolean, description: "Operator has points of presence in India (queries may still leave India)"}

    UpstreamConfig:
      type: object
      required: [preset, protocol]
      properties:
        preset: {type: string, enum: [cloudflare, google, quad9, adguard, custom]}
        protocol: {type: string, enum: [doh, dot]}
        custom_url:
          type: [string, 'null']
          description: Required when preset=custom. Must be https:// (DoH) or tls:// host (DoT)
          maxLength: 255
        bootstrap_ips:
          type: array
          maxItems: 4
          items: {type: string, maxLength: 255}

    DhcpServerConfig:
      type: object
      required: [enabled]
      properties:
        enabled: {type: boolean}
        range_start: {type: string, format: ipv4, maxLength: 15}
        range_end: {type: string, format: ipv4, maxLength: 15}
        subnet_mask: {type: string, format: ipv4, maxLength: 15}
        gateway: {type: string, format: ipv4, maxLength: 15}
        lease_hours: {type: integer, minimum: 1, maximum: 168, default: 24, format: int32}
        static_leases:
          type: array
          maxItems: 256
          items:
            type: object
            required: [mac, ipv4]
            properties:
              mac: {type: string, pattern: '^([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}$', maxLength: 255}
              ipv4: {type: string, format: ipv4, maxLength: 15}
              hostname: {type: string, maxLength: 63}

    Settings:
      type: object
      required: [retention_days, max_db_mb, timezone, upstream, doh_block, capture_mode, dhcp_server, alerts_enabled, remote_enabled, monitoring_active]
      properties:
        retention_days: {type: integer, enum: [7, 30, 90], format: int32, minimum: 0, maximum: 2147483647}
        max_db_mb: {type: integer, minimum: 64, format: int32, maximum: 2147483647}
        timezone: {type: string, examples: [Asia/Kolkata], maxLength: 255}
        upstream: {$ref: '#/components/schemas/UpstreamConfig'}
        doh_block:
          type: object
          required: [enabled, block_icloud_relay]
          properties:
            enabled: {type: boolean}
            block_icloud_relay: {type: boolean}
        capture_mode: {$ref: '#/components/schemas/CaptureMode'}
        dhcp_server: {$ref: '#/components/schemas/DhcpServerConfig'}
        alerts_enabled: {type: boolean}
        remote_enabled: {type: boolean, readOnly: true, description: "Change via /v1/remote/*"}
        monitoring_active:
          type: boolean
          readOnly: true
          description: False when the network_monitoring consent has been withdrawn (resolver still serves DNS)
        notice_page_enabled:
          type: boolean
          description: Serve the household network notice page at http://notice.home.arpa

    SettingsUpdate:
      type: object
      minProperties: 1
      properties:
        retention_days: {type: integer, enum: [7, 30, 90], format: int32, minimum: 0, maximum: 2147483647}
        max_db_mb: {type: integer, minimum: 64, format: int32, maximum: 2147483647}
        timezone: {type: string, maxLength: 255}
        upstream: {$ref: '#/components/schemas/UpstreamConfig'}
        doh_block:
          type: object
          properties:
            enabled: {type: boolean}
            block_icloud_relay: {type: boolean}
        capture_mode: {$ref: '#/components/schemas/CaptureMode'}
        dhcp_server: {$ref: '#/components/schemas/DhcpServerConfig'}
        alerts_enabled: {type: boolean}
        notice_page_enabled: {type: boolean}

    RemoteStatus:
      type: object
      required: [enabled, state]
      properties:
        enabled: {type: boolean}
        state: {type: string, enum: [disabled, connecting, connected, error]}
        relay_url: {type: [string, 'null'], format: uri, maxLength: 2048}
        connected_since: {type: [string, 'null'], format: date-time, maxLength: 35}
        last_error_code: {type: [string, 'null'], maxLength: 255}

    RemoteEnableRequest:
      type: object
      required: [enrollment_code, relay_url]
      properties:
        enrollment_code: {type: string, minLength: 16, maxLength: 64}
        relay_url:
          type: string
          format: uri
          pattern: '^wss://'
          description: Must match an allow-listed relay host compiled into the agent for the flavor

          maxLength: 2048
    UpdateStatus:
      type: object
      required: [current_version, install_type, auto_update]
      properties:
        current_version: {type: string, maxLength: 255}
        available_version: {type: [string, 'null'], maxLength: 255}
        manifest_verified_at: {type: [string, 'null'], format: date-time, maxLength: 35}
        install_type: {type: string, enum: [docker, openwrt, binary]}
        auto_update: {type: boolean}
        docker_update_command:
          type: [string, 'null']
          description: Digest-pinned command for Docker installs (notify-only mode)

          maxLength: 512
    Dashboard:
      type: object
      required: [generated_at, online_now, devices_total, top_sites_today, new_devices_this_week, unread_alerts]
      properties:
        generated_at: {type: string, format: date-time, maxLength: 35}
        online_now:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/DeviceSummary'}
        devices_total: {type: integer, format: int32, minimum: 0, maximum: 2147483647}
        top_sites_today:
          type: array
          maxItems: 10
          items: {$ref: '#/components/schemas/SiteSummary'}
        new_devices_this_week:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/DeviceSummary'}
        unread_alerts: {type: integer, format: int32, minimum: 0, maximum: 2147483647}
        bypass_suspected_devices: {type: integer, format: int32, minimum: 0, maximum: 2147483647}

    DeviceType:
      type: string
      enum: [phone, tablet, computer, tv, streaming, speaker, console, camera, printer, iot, router, wearable, unknown]

    DeviceSummary:
      type: object
      required: [id, name, device_type, online]
      properties:
        id: {type: string, format: uuid, maxLength: 36}
        name: {type: string, maxLength: 255}
        device_type: {$ref: '#/components/schemas/DeviceType'}
        online: {type: boolean}
        profile_id: {type: [string, 'null'], format: uuid, maxLength: 36}
        first_seen_at: {type: string, format: date-time, maxLength: 35}

    Device:
      type: object
      required: [id, name, auto_name, device_type, type_source, trusted, online, first_seen_at, last_seen_at, mac_display, possibly_randomized, rev]
      properties:
        id: {type: string, format: uuid, maxLength: 36}
        name: {type: string, description: "display_name if set, otherwise auto_name", maxLength: 255}
        display_name: {type: [string, 'null'], maxLength: 255}
        auto_name: {type: string, maxLength: 255}
        vendor: {type: [string, 'null'], maxLength: 255}
        device_type: {$ref: '#/components/schemas/DeviceType'}
        type_source: {type: string, enum: [heuristic, user]}
        profile_id: {type: [string, 'null'], format: uuid, maxLength: 36}
        trusted: {type: boolean}
        online: {type: boolean}
        ipv4: {type: [string, 'null'], maxLength: 255}
        mac_display:
          type: string
          description: Masked unless reveal=true by an owner, e.g. "••:••:••:3A:4F:C2"
          maxLength: 255
        possibly_randomized: {type: boolean}
        bypass_suspected_at: {type: [string, 'null'], format: date-time, maxLength: 35}
        first_seen_at: {type: string, format: date-time, maxLength: 35}
        last_seen_at: {type: string, format: date-time, maxLength: 35}
        current_session_started_at: {type: [string, 'null'], format: date-time, maxLength: 35}
        rev: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775807}

    DeviceUpdate:
      type: object
      minProperties: 1
      properties:
        display_name: {type: [string, 'null'], minLength: 1, maxLength: 64}
        device_type: {$ref: '#/components/schemas/DeviceType'}
        profile_id: {type: [string, 'null'], format: uuid, maxLength: 36}
        trusted: {type: boolean}

    DevicePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Device'}
          maxItems: 200
        next_cursor: {type: [string, 'null'], maxLength: 256}

    DeviceIdentifier:
      type: object
      required: [kind, value, first_seen_at, last_seen_at]
      properties:
        kind: {type: string, enum: [mac, dhcp_client_id, hostname, dhcp_fp, mdns_name, ipv6_iid]}
        value: {type: string, description: "MAC values are masked unless reveal=true", maxLength: 255}
        locally_administered: {type: boolean, description: "For MACs, the randomised/private bit is set"}
        first_seen_at: {type: string, format: date-time, maxLength: 35}
        last_seen_at: {type: string, format: date-time, maxLength: 35}

    MergeRequest:
      type: object
      required: [source_ids]
      properties:
        source_ids:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items: {type: string, format: uuid, maxLength: 36}

    MergeResult:
      type: object
      required: [merge_id, device, undo_expires_at]
      properties:
        merge_id: {type: string, format: uuid, maxLength: 36}
        device: {$ref: '#/components/schemas/Device'}
        undo_expires_at: {type: string, format: date-time, maxLength: 35}

    Session:
      type: object
      required: [id, device_id, connected_at, rev]
      properties:
        id: {type: string, description: "Opaque session id", maxLength: 255}
        device_id: {type: string, format: uuid, maxLength: 36}
        connected_at: {type: string, format: date-time, maxLength: 35}
        disconnected_at: {type: [string, 'null'], format: date-time, description: "null = still online", maxLength: 35}
        duration_seconds: {type: [integer, 'null'], format: int32, minimum: 0, maximum: 2147483647}
        ipv4: {type: [string, 'null'], maxLength: 255}
        rev: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775807}

    SessionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Session'}
          maxItems: 200
        next_cursor: {type: [string, 'null'], maxLength: 256}

    CategoryCode:
      type: string
      enum: [social, video, gaming, adult, shopping, education, news, malicious, infrastructure, unknown]

    Category:
      type: object
      required: [code, sensitive, alertable, hidden_by_default]
      properties:
        code: {$ref: '#/components/schemas/CategoryCode'}
        sensitive: {type: boolean}
        alertable: {type: boolean}
        hidden_by_default: {type: boolean}

    Site:
      type: object
      required: [etld1, category, category_source]
      properties:
        etld1: {type: string, examples: [youtube.com], maxLength: 253}
        brand: {type: [string, 'null'], examples: [YouTube], maxLength: 255}
        category: {$ref: '#/components/schemas/CategoryCode'}
        category_source: {type: string, enum: [bundle, user]}

    SiteSummary:
      allOf:
        - $ref: '#/components/schemas/Site'
        - type: object
          required: [query_count, device_count, first_seen_at, last_seen_at]
          properties:
            query_count: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775807}
            device_count: {type: integer, format: int32, minimum: 0, maximum: 2147483647}
            first_seen_at: {type: string, format: date-time, maxLength: 35}
            last_seen_at: {type: string, format: date-time, maxLength: 35}

    SitePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/SiteSummary'}
          maxItems: 200
        next_cursor: {type: [string, 'null'], maxLength: 256}

    QueryRecord:
      type: object
      required: [id, ts, device_id, qname, etld1, qtype, rcode, repeat_count, cached, category]
      properties:
        id: {type: string, maxLength: 255}
        ts: {type: string, format: date-time, maxLength: 35}
        last_ts: {type: string, format: date-time, maxLength: 35}
        device_id: {type: string, format: uuid, maxLength: 36}
        qname: {type: string, maxLength: 253}
        etld1: {type: string, maxLength: 253}
        category: {$ref: '#/components/schemas/CategoryCode'}
        qtype: {type: string, examples: [A, AAAA, HTTPS], maxLength: 255}
        rcode: {type: string, examples: [NOERROR, NXDOMAIN], maxLength: 255}
        repeat_count: {type: integer, minimum: 1, format: int32, maximum: 2147483647}
        cached: {type: boolean}
        doh_canary: {type: boolean}
        upstream_ms: {type: [integer, 'null'], format: int32, minimum: 0, maximum: 2147483647}
        answer: {type: [string, 'null'], maxLength: 512}

    QueryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/QueryRecord'}
          maxItems: 200
        next_cursor: {type: [string, 'null'], maxLength: 256}

    Schedule:
      type: object
      description: Allowed online hours per weekday in household local time. Used by outside_hours alerts (and future blocking).
      required: [windows]
      properties:
        windows:
          type: array
          maxItems: 28
          items:
            type: object
            required: [days, start, end]
            properties:
              days:
                type: array
                minItems: 1
                uniqueItems: true
                items: {type: string, enum: [mon, tue, wed, thu, fri, sat, sun]}
                maxItems: 100
              start: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', maxLength: 255}
              end: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: "May be earlier than start (crosses midnight)", maxLength: 255}

    Profile:
      type: object
      required: [id, name, avatar, is_minor, device_count, rev]
      properties:
        id: {type: string, format: uuid, maxLength: 36}
        name: {type: string, maxLength: 255}
        avatar: {type: string, maxLength: 255}
        is_minor: {type: boolean}
        schedule: {oneOf: [$ref: '#/components/schemas/Schedule', type: 'null']}
        device_count: {type: integer, format: int32, minimum: 0, maximum: 2147483647}
        rev: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775807}

    ProfileCreate:
      type: object
      required: [name, is_minor]
      properties:
        name: {type: string, minLength: 1, maxLength: 40}
        avatar: {type: string, maxLength: 32}
        is_minor: {type: boolean}
        parental_consent_id:
          type: string
          format: uuid
          description: Required when is_minor=true. Id of a granted minor_parental_consent record created for this profile.
          maxLength: 36
        schedule: {oneOf: [$ref: '#/components/schemas/Schedule', type: 'null']}

    ProfileUpdate:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 40}
        avatar: {type: string, maxLength: 32}
        schedule: {oneOf: [$ref: '#/components/schemas/Schedule', type: 'null']}

    AlertKind:
      type: string
      enum: [new_device, outside_hours, category_access, dns_bypass, agent_update]

    Alert:
      type: object
      required: [ref, kind, severity, created_at, read, rev]
      properties:
        ref: {$ref: '#/components/schemas/AlertRef'}
        kind: {$ref: '#/components/schemas/AlertKind'}
        severity: {type: string, enum: [info, warning, critical]}
        created_at: {type: string, format: date-time, maxLength: 35}
        read: {type: boolean}
        device: {oneOf: [$ref: '#/components/schemas/DeviceSummary', type: 'null']}
        site: {oneOf: [$ref: '#/components/schemas/Site', type: 'null']}
        details:
          type: object
          description: Kind-specific fields (e.g. schedule window for outside_hours, version for agent_update)
          additionalProperties: true
        rev: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775807}

    AlertPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Alert'}
          maxItems: 200
        next_cursor: {type: [string, 'null'], maxLength: 256}

    AlertRule:
      type: object
      required: [id, kind, enabled, params]
      properties:
        id: {type: string, format: uuid, maxLength: 36}
        kind: {type: string, enum: [new_device, outside_hours, category_access, dns_bypass]}
        enabled: {type: boolean}
        profile_id: {type: [string, 'null'], format: uuid, maxLength: 36}
        params: {$ref: '#/components/schemas/AlertRuleParams'}

    AlertRuleWrite:
      type: object
      required: [kind, enabled]
      properties:
        kind: {type: string, enum: [new_device, outside_hours, category_access, dns_bypass]}
        enabled: {type: boolean}
        profile_id: {type: [string, 'null'], format: uuid, maxLength: 36}
        params: {$ref: '#/components/schemas/AlertRuleParams'}

    AlertRuleParams:
      type: object
      properties:
        categories:
          type: array
          description: For category_access only
          uniqueItems: true
          items: {type: string, enum: [adult, malicious]}
          maxItems: 100
      additionalProperties: false

    ConsentPurpose:
      type: string
      enum: [network_monitoring, monitoring_disclosure_ack, minor_parental_consent, remote_access, push_notifications, crash_reports, analytics]

    ConsentCreate:
      type: object
      required: [purpose, notice_version, language, granted, evidence_sha256]
      properties:
        purpose: {$ref: '#/components/schemas/ConsentPurpose'}
        notice_version: {type: string, maxLength: 32, examples: ['2026-11-v1']}
        language: {type: string, enum: [en, hi, te, ta]}
        granted: {type: boolean}
        evidence_sha256:
          type: string
          contentEncoding: base64
          description: SHA-256 of the exact notice text displayed
          maxLength: 64
        profile_id:
          type: [string, 'null']
          format: uuid
          description: Required for minor_parental_consent. May reference a profile being created (see createProfile).
          maxLength: 36
        attestations:
          type: array
          description: Statements the user explicitly confirmed (e.g. "i_am_parent_or_guardian", "will_inform_household")
          items: {type: string, maxLength: 64}
          maxItems: 100

    ConsentRecord:
      type: object
      required: [id, purpose, notice_version, language, granted, method, created_at]
      properties:
        id: {type: string, format: uuid, maxLength: 36}
        purpose: {$ref: '#/components/schemas/ConsentPurpose'}
        notice_version: {type: string, maxLength: 255}
        language: {type: string, maxLength: 255}
        granted: {type: boolean}
        method: {type: string, enum: [in_app_ack, parental_attestation]}
        member_id: {type: [string, 'null'], format: uuid, maxLength: 36}
        profile_id: {type: [string, 'null'], format: uuid, maxLength: 36}
        created_at: {type: string, format: date-time, maxLength: 35}
        withdrawn_at: {type: [string, 'null'], format: date-time, maxLength: 35}

    AuditEntry:
      type: object
      required: [id, ts, actor, action]
      properties:
        id: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775807}
        ts: {type: string, format: date-time, maxLength: 35}
        actor: {type: string, maxLength: 255}
        action: {type: string, examples: [pairing.completed, settings.retention_changed, device.mac_revealed], maxLength: 255}
        target_type: {type: [string, 'null'], maxLength: 255}
        target_id: {type: [string, 'null'], maxLength: 255}
        details: {type: object, additionalProperties: true}

    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AuditEntry'}
          maxItems: 200
        next_cursor: {type: [string, 'null'], maxLength: 256}

    Tombstone:
      type: object
      required: [entity, id, rev]
      properties:
        entity: {type: string, enum: [device, session, alert, profile, member, client, alert_rule]}
        id: {type: string, maxLength: 255}
        rev: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775807}

    SyncChanges:
      type: object
      required: [from_rev, to_rev, has_more, devices, sessions, alerts, profiles, deleted]
      properties:
        from_rev: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775807}
        to_rev: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775807}
        has_more: {type: boolean}
        devices:
          type: array
          items: {$ref: '#/components/schemas/Device'}
          maxItems: 1000
        sessions:
          type: array
          items: {$ref: '#/components/schemas/Session'}
          maxItems: 1000
        alerts:
          type: array
          items: {$ref: '#/components/schemas/Alert'}
          maxItems: 1000
        profiles:
          type: array
          items: {$ref: '#/components/schemas/Profile'}
          maxItems: 1000
        settings: {oneOf: [$ref: '#/components/schemas/Settings', type: 'null']}
        deleted:
          type: array
          items: {$ref: '#/components/schemas/Tombstone'}
          maxItems: 1000

    ExportDocument:
      type: object
      required: [format_version, exported_at, household_id, range, devices, sessions, queries, profiles, alerts, consents]
      properties:
        format_version: {type: integer, const: 1, format: int32, minimum: 0, maximum: 2147483647}
        exported_at: {type: string, format: date-time, maxLength: 35}
        household_id: {type: string, format: uuid, maxLength: 36}
        range:
          type: object
          required: [from, to]
          properties:
            from: {type: string, format: date-time, maxLength: 35}
            to: {type: string, format: date-time, maxLength: 35}
        devices:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Device'
              - type: object
                properties:
                  identifiers:
                    type: array
                    items: {$ref: '#/components/schemas/DeviceIdentifier'}
                    maxItems: 100
          maxItems: 10000000
        sessions:
          type: array
          items: {$ref: '#/components/schemas/Session'}
          maxItems: 10000000
        queries:
          type: array
          items: {$ref: '#/components/schemas/QueryRecord'}
          maxItems: 10000000
        profiles:
          type: array
          items: {$ref: '#/components/schemas/Profile'}
          maxItems: 10000000
        alerts:
          type: array
          items: {$ref: '#/components/schemas/Alert'}
          maxItems: 10000000
        consents:
          type: array
          items: {$ref: '#/components/schemas/ConsentRecord'}
          maxItems: 10000000
